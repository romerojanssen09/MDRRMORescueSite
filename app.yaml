kind: wasmer.io/App.v0
owner: romerojanssen09
name: mdrrmo-rescue-site
package: .
description: "MDRRMO Rescue System - Laravel Admin Dashboard & Emergency Dispatch"

# Non-secret runtime defaults for Wasmer Edge.
# Configure secrets in Wasmer Dashboard or via `wasmer app secrets create`:
#   APP_KEY, APP_URL, DATABASE_URL, DATABASE_URL_UNPOOLED,
#   SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_KEY, MAPBOX_ACCESS_TOKEN
env:
  APP_NAME: "MDRRMO Admin"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  APP_TIMEZONE: Asia/Manila
  DB_CONNECTION: pgsql
  DB_SSLMODE: require
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  SESSION_DRIVER: cookie
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: uploads
  UPLOADS_PATH: /data/uploads

volumes:
  - name: uploads
    mount: /data/uploads

capabilities:
  # Wasmer Edge InstaBoot: pre-warm PHP OpCache + Laravel framework into snapshots
  # https://docs.wasmer.io/edge/learn/instaboot/
  instaboot:
    max_age: 12h
    requests:
      - path: /
        method: GET
      - path: /_bootstrap
        method: GET
      - path: /api/health
        method: GET
      - path: /admin/login
        method: GET
